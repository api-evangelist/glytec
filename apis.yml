aid: glytec
name: Glytec
description: >-
  Glytec is a healthcare software company, founded in 2006, that builds GlytecOne — a cloud-based enterprise
  glycemic and insulin management platform used by 400+ hospitals and health systems in the United States. Its
  core product, Glucommander, is an FDA-cleared Class II Software as a Medical Device that computes personalized
  IV and subcutaneous insulin dosing recommendations for adult and pediatric (ages 2-17) patients from real-time
  and historical glucose data and returns them into the clinician's workflow for review. The platform also
  includes Command Center, performance insights and analytics, population health, and CMS/eCQM reporting for the
  CMS816 severe hypoglycemia and CMS871 severe hyperglycemia hospital harm measures. Glytec publishes no public
  developer API or machine-readable specification: integration is delivered under contract as bi-directional
  HL7 interfaces plus single sign-on clinical decision support into Epic, Oracle Health (Cerner) and MEDITECH,
  with a Glucommander listing in the Epic Showroom. The platform is maintained in compliance with HIPAA and is
  HITRUST CSF certified.
